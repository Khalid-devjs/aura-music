app = 'aura-music'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[processes]
  app = 'python main.py'

[volumes]
  cache = { name = 'cache', mount_path = '/app/cache' }
  logs = { name = 'logs', mount_path = '/app/logs' }

[http_service]
  internal_port = 8080
  force_https = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
